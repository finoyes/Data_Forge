services:
  studybuddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceforge-studybuddy
    restart: unless-stopped
    ports:
      - "5173:5173"   # Web Frontend (Vite)
      - "7880:7880"   # Token Server
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - VITE_TOKEN_SERVER_URL=http://localhost:7880/token
      - VITE_LIVEKIT_URL=wss://data-forge-409dayt7.livekit.cloud
      - LIVEKIT_URL=wss://data-forge-409dayt7.livekit.cloud
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./agent:/app/agent
